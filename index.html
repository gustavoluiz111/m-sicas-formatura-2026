<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Músicas de Formatura 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/student.css">
</head>
<body>

    <!-- Ambient background effects -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="grain-overlay"></div>

    <div class="app-layout">
        
        <!-- TOPO DISCRETO -->
        <header class="top-bar">
            <div class="brand-tag">FORMATURA 2026</div>
            <a href="admin.html" class="admin-link">🔒 Painel Admin</a>
        </header>

        <!-- CONTAINER PRINCIPAL -->
        <main class="center-stage">

            <!-- PASSO 1: ESCOLHER A TURMA (DIRETO E IMPACTANTE) -->
            <section id="stepTurma" class="view-panel active">
                <div class="headline-box">
                    <span class="headline-sub">ESCOLHA SUA TURMA</span>
                    <h1 class="headline-main">
                        <span class="outline-txt">SELEÇÃO DE</span>
                        <span class="fill-txt">MÚSICAS</span>
                    </h1>
                </div>

                <div class="turmas-grid">
                    <!-- TURMA A -->
                    <button class="turma-btn" data-turma="A">
                        <div class="glass-fill"></div>
                        <div class="btn-content">
                            <span class="btn-tag">TERCEIRÃO</span>
                            <span class="btn-letter">3º A</span>
                            <span class="btn-action">ENTRAR NA TURMA A →</span>
                        </div>
                    </button>

                    <!-- TURMA B -->
                    <button class="turma-btn turma-b" data-turma="B">
                        <div class="glass-fill"></div>
                        <div class="btn-content">
                            <span class="btn-tag">TERCEIRÃO</span>
                            <span class="btn-letter">3º B</span>
                            <span class="btn-action">ENTRAR NA TURMA B →</span>
                        </div>
                    </button>
                </div>
            </section>

            <!-- PASSO 2: SELECIONAR SEU NOME E ENVIAR MÚSICA -->
            <section id="stepAlunos" class="view-panel">
                <div class="panel-head">
                    <button id="btnVoltarTurma" class="back-pill">← Trocar de Turma</button>
                    <div class="current-turma-badge" id="turmaActiveBadge">3º ANO A</div>
                </div>

                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Pesquisar seu nome..." autocomplete="off">
                </div>

                <!-- LISTA DE ALUNOS -->
                <div class="alunos-list-scroll" id="alunosList"></div>
            </section>

        </main>

        <!-- MODAL SIMPLES PARA ENVIAR/VER MÚSICA DO ALUNO -->
        <div id="modalAluno" class="modal-overlay">
            <div class="modal-card">
                <div class="modal-header">
                    <div>
                        <span class="modal-sub" id="modalTurmaTag">TURMA A</span>
                        <h3 class="modal-title" id="modalAlunoNome">Nome do Aluno</h3>
                    </div>
                    <button id="btnFecharModal" class="btn-close">✕</button>
                </div>

                <!-- SITUAÇÃO ATUAL -->
                <div class="situacao-card" id="situacaoBox">
                    <div class="sit-status" id="sitStatusTag">PENDENTE</div>
                    <div class="sit-info" id="sitMusicaTxt">Nenhuma música escolhida ainda</div>
                </div>

                <!-- FORMULÁRIO RÁPIDO -->
                <form id="formMusica" class="form-rapido">
                    <div class="form-group">
                        <label>Link do YouTube</label>
                        <div class="input-detect">
                            <input type="url" id="inputYtLink" placeholder="https://www.youtube.com/watch?v=...">
                            <button type="button" id="btnDetectar">Detectar</button>
                        </div>
                        <span class="detect-result" id="detectResult"></span>
                    </div>

                    <div class="form-group">
                        <label>Nome da Música *</label>
                        <input type="text" id="inputNomeMusica" placeholder="Ex: Viva La Vida" required>
                    </div>

                    <div class="form-group">
                        <label>Artista ou Banda</label>
                        <input type="text" id="inputArtista" placeholder="Ex: Coldplay">
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Início do Trecho</label>
                            <input type="text" id="inputInicio" placeholder="Ex: 0:40">
                        </div>
                        <div class="form-group">
                            <label>Fim do Trecho</label>
                            <input type="text" id="inputFim" placeholder="Ex: 1:10">
                        </div>
                    </div>

                    <button type="submit" class="btn-salvar" id="btnSalvarMusica">Salvar Minha Música ✓</button>
                </form>
            </div>
        </div>

        <!-- AVISO TOAST -->
        <div id="toast" class="toast-box">Música salva com sucesso!</div>

    </div>

    <script src="js/student.js"></script>
</body>
</html>
