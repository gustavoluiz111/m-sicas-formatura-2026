<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Músicas de Formatura 2026</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/student.css">
</head>
<body>

    <!-- Ambient background effects (Azul escuro, prata e dourado) -->
    <div class="ambient-glow glow-blue"></div>
    <div class="ambient-glow glow-gold"></div>
    <div class="grain-overlay"></div>

    <div class="app-layout">
        
        <!-- TOPO -->
        <header class="top-bar">
            <div class="brand-tag">FORMATURA 2026</div>
            <a href="admin.html" class="admin-link">Painel Admin</a>
        </header>

        <!-- CONTAINER PRINCIPAL -->
        <main class="center-stage">

            <!-- PASSO 1: ESCOLHER A TURMA -->
            <section id="stepTurma" class="view-panel active">
                <div class="headline-box">
                    <span class="headline-sub">SELEÇÃO OFICIAL DE ENTRADA</span>
                    <h1 class="headline-main">
                        <span class="silver-txt">ESCOLHA SUA</span>
                        <span class="gold-txt">TURMA</span>
                    </h1>
                </div>

                <div class="turmas-grid">
                    <!-- TURMA A -->
                    <button class="turma-btn turma-gold" data-turma="A">
                        <div class="glass-fill"></div>
                        <div class="btn-content">
                            <span class="btn-tag">TERCEIRÃO 2026</span>
                            <span class="btn-letter">3º A</span>
                            <span class="btn-action">Acessar Turma A →</span>
                        </div>
                    </button>

                    <!-- TURMA B -->
                    <button class="turma-btn turma-silver" data-turma="B">
                        <div class="glass-fill"></div>
                        <div class="btn-content">
                            <span class="btn-tag">TERCEIRÃO 2026</span>
                            <span class="btn-letter">3º B</span>
                            <span class="btn-action">Acessar Turma B →</span>
                        </div>
                    </button>
                </div>
            </section>

            <!-- PASSO 2: SELECIONAR SEU NOME -->
            <section id="stepAlunos" class="view-panel">
                <div class="panel-head">
                    <button id="btnVoltarTurma" class="back-pill">← Trocar de Turma</button>
                    <div class="current-turma-badge" id="turmaActiveBadge">3º ANO A</div>
                </div>

                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Pesquisar seu nome..." autocomplete="off">
                </div>

                <!-- LISTA DE ALUNOS -->
                <div class="alunos-list-scroll" id="alunosList"></div>
            </section>

        </main>

        <!-- MODAL DO FORMANDO: ESCOLHER/CORTAR MÚSICA & GERAR PNG -->
        <div id="modalAluno" class="modal-overlay">
            <div class="modal-card">
                <div class="modal-header">
                    <div>
                        <span class="modal-sub" id="modalTurmaTag">TURMA A</span>
                        <h3 class="modal-title" id="modalAlunoNome">Nome do Aluno</h3>
                    </div>
                    <button id="btnFecharModal" class="btn-close">✕</button>
                </div>

                <!-- SITUAÇÃO ATUAL -->
                <div class="situacao-card" id="situacaoBox">
                    <div class="sit-status" id="sitStatusTag">PENDENTE</div>
                    <div class="sit-info" id="sitMusicaTxt">Nenhuma música escolhida ainda</div>
                </div>

                <!-- BOTÃO DE BAIXAR COMPROVANTE PNG (QUANDO JÁ TEM MÚSICA) -->
                <button type="button" id="btnDownloadCardPng" class="btn-download-png" style="display:none;">
                    Baixar Cartão da Minha Música (PNG)
                </button>

                <!-- FORMULÁRIO -->
                <form id="formMusica" class="form-rapido">
                    
                    <!-- ESCOLHA DO LINK OU BUSCA NO YOUTUBE -->
                    <div class="form-group">
                        <label>Escolha o Link ou Procure o Vídeo</label>
                        <div class="input-detect-row">
                            <input type="url" id="inputYtLink" placeholder="Cole o link do YouTube...">
                            <button type="button" id="btnProcurarVideo" class="btn-secondary-action">Procurar Vídeo</button>
                            <button type="button" id="btnDetectar" class="btn-secondary-action">Detectar</button>
                        </div>
                        <span class="detect-result" id="detectResult"></span>
                    </div>

                    <!-- REPRODUTOR E CORTADOR DE VÍDEO EMBUTIDO NO SITE -->
                    <div class="video-cutter-area" id="videoCutterArea" style="display:none;">
                        <div class="cutter-video-frame">
                            <div id="youtubePlayerTarget"></div>
                        </div>
                        <div class="cutter-timer-row">
                            <span>Tempo atual: <strong id="liveCurrentTime">0:00</strong></span>
                            <div class="stamp-btns">
                                <button type="button" id="btnStampStart">Definir Início</button>
                                <button type="button" id="btnStampEnd">Definir Fim (+45s)</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Nome da Música *</label>
                        <input type="text" id="inputNomeMusica" placeholder="Ex: Viva La Vida" required>
                    </div>

                    <div class="form-group">
                        <label>Artista ou Banda</label>
                        <input type="text" id="inputArtista" placeholder="Ex: Coldplay">
                    </div>

                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Início do Trecho</label>
                            <input type="text" id="inputInicio" placeholder="Ex: 0:40 ou 40">
                        </div>
                        <div class="form-group">
                            <label>Fim do Trecho (Regra: 45s)</label>
                            <input type="text" id="inputFim" placeholder="Calculado automaticamente">
                        </div>
                    </div>

                    <div class="rule-box-45s">
                        Regra de Entrada: O trecho terá exatamente <strong>45 segundos</strong> de duração para a sua entrada solene.
                    </div>

                    <button type="submit" class="btn-salvar" id="btnSalvarSugestao">Salvar Sugestão</button>
                </form>
            </div>
        </div>

        <!-- CANVAS INVISÍVEL PARA GERAÇÃO DO CARTÃO PNG -->
        <canvas id="cardCanvas" width="900" height="540" style="display:none;"></canvas>

        <!-- AVISO TOAST -->
        <div id="toast" class="toast-box">Operação realizada com sucesso!</div>

    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/cloudSync.js"></script>
    <script src="js/student.js"></script>
</body>
</html>
